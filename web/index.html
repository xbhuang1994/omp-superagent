<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1120">
  <title>OMP 对话面板</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span>O</span><span>M</span><span>P</span></div>
        <div>
          <h1>OMP 工作台</h1>
          <p>持久 Orchestrator Session</p>
        </div>
      </div>
      <div class="topbar-side">
        <button id="worker-button" class="control-button worker-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 9h2m-2 3h4m-5 8h12m-6-4v4m5-13h2m-2 3h2"/></svg>
          Worker <span id="worker-count" class="worker-count">0</span>
        </button>
        <button id="wechat-button" class="control-button wechat-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 11.5h.01M15.5 11.5h.01M21 12a8 8 0 0 1-8 8 9 9 0 0 1-3.8-.8L4 21l1.5-4.2A8 8 0 1 1 21 12Z"/></svg>
          连接微信
        </button>
        <button id="reset-session" class="control-button reset-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5"/></svg>
          重置 Session
        </button>
        <span id="status" class="status" role="status">连接中…</span>
      </div>
    </header>

    <div class="conversation">
      <section id="transcript" class="transcript" aria-label="对话记录" aria-live="polite"></section>
      <div id="empty" class="empty">
        <div class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.5 9.6 9.6 0 0 1-4-.9L3 21l1.9-4.5A8.4 8.4 0 0 1 3 11.5a8.4 8.4 0 0 1 9-8.5 8.4 8.4 0 0 1 9 8.5Z"/><path d="M8 11.5h.01M12 11.5h.01M16 11.5h.01"/></svg>
        </div>
        <h2>开始一段新对话</h2>
        <p>向 Orchestrator 发送消息，或连接微信后继续对话。</p>
      </div>
    </div>

    <form id="composer" class="composer">
      <div class="composer-label"><label for="message">发送消息</label><span>支持图片与任意文件</span></div>
      <textarea id="message" name="message" rows="4" maxlength="8000" placeholder="输入任务、问题或需要处理的内容…"></textarea>
      <div id="attachment-list" class="attachment-list" aria-label="已选附件"></div>
      <div class="composer-footer">
        <div class="upload-row">
          <label class="upload-button" for="attachments">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21.4 11.6-8.9 8.9a6 6 0 0 1-8.5-8.5l9.6-9.6a4 4 0 0 1 5.7 5.7l-9.6 9.6a2 2 0 0 1-2.8-2.8l8.9-8.9"/></svg>
            添加附件
          </label>
          <input id="attachments" type="file" multiple>
          <span class="upload-hint">最多 3 个文件，每个不超过 5 MiB</span>
        </div>
        <div class="actions">
          <span id="feedback" class="feedback" role="alert"></span>
          <div class="send-group">
            <span class="shortcut">Ctrl / ⌘ + Enter</span>
            <button id="send" class="send-button" type="submit">
              发送
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 14-7-4 14-3-6-7-1Zm7 1 7-8"/></svg>
            </button>
          </div>
        </div>
      </div>
    </form>
  </main>

  <dialog id="wechat-modal" class="wechat-modal" aria-labelledby="wechat-title">
    <form method="dialog" class="dialog-close"><button type="submit" aria-label="关闭">×</button></form>
    <span class="dialog-kicker">WECHAT CHANNEL</span>
    <h2 id="wechat-title">连接微信</h2>
    <p id="wechat-message" role="status">正在获取连接状态…</p>
    <img id="wechat-qr" class="wechat-qr" alt="微信连接二维码" hidden>
    <form id="wechat-verify" class="wechat-verify" hidden>
      <label for="wechat-code">手机微信显示的验证码</label>
      <div><input id="wechat-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]+" required><button type="submit">提交验证码</button></div>
    </form>
    <div class="dialog-actions">
      <button id="wechat-disconnect" class="danger" type="button" hidden>断开微信</button>
      <button id="wechat-refresh" type="button">重新获取二维码</button>
    </div>
  </dialog>

  <dialog id="worker-modal" class="worker-modal" aria-labelledby="worker-title">
    <form method="dialog" class="dialog-close"><button type="submit" aria-label="关闭">×</button></form>
    <span class="dialog-kicker">BACKGROUND EXECUTION</span>
    <h2 id="worker-title">后台 Worker</h2>
    <p id="worker-summary" class="worker-summary">正在读取 Worker 状态…</p>
    <div class="worker-layout">
      <section class="worker-list-panel" aria-label="Worker 列表"><div id="worker-list" class="worker-list"></div></section>
      <section id="worker-detail" class="worker-detail" aria-label="Worker 详细进度">
        <div class="worker-placeholder">选择一个 Worker 查看实际状态、报告和最近活动。</div>
      </section>
    </div>
  </dialog>
  <script src="/app.js" defer></script>
</body>
</html>
